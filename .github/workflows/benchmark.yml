name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday at 3 AM UTC
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Update baseline with these results'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.88"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"

jobs:
  bench:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run benchmarks
        run: cargo bench --workspace --locked -- --output-format bencher | tee bench-results.txt

      - name: Check performance regressions
        if: inputs.update_baseline != true
        run: bash scripts/check_perf_regression.sh

      - name: Update baselines
        if: inputs.update_baseline
        run: bash scripts/check_perf_regression.sh --update

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-${{ github.sha }}
          path: bench-results.txt
          retention-days: 90

      - name: Save baseline locally
        if: inputs.update_baseline
        run: |
          mkdir -p .benchmarks
          cp bench-results.txt .benchmarks/baseline.txt

      - name: Create PR with updated baseline
        if: inputs.update_baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/update-benchmark-baseline"

          # Check if branch already exists
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "Branch $BRANCH already exists, updating..."
          fi

          git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"
          mkdir -p .benchmarks
          cp bench-results.txt .benchmarks/baseline.txt
          git add .benchmarks/baseline.txt

          if git diff --cached --quiet; then
            echo "No changes to baseline — skipping PR."
            exit 0
          fi

          git commit -m "chore: update benchmark baseline"
          git push origin "$BRANCH" --force-with-lease

          # Create PR if one doesn't exist
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' || true)
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --title "chore: update benchmark baseline" \
              --body "Automated benchmark baseline update from CI run \`${{ github.sha }}\`." \
              --head "$BRANCH" \
              --base main
          else
            echo "PR #$EXISTING_PR already open for baseline update."
          fi

  bench-scale:
    name: Scale Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run scale benchmarks
        run: |
          cargo bench -p civit-core --bench scale_benchmarks --locked -- --output-format bencher | tee scale-bench-results.txt

      - name: Run generator benchmarks
        run: |
          cargo bench -p civit-core --bench generators --locked -- --output-format bencher | tee generator-bench-results.txt

      - name: Check scale regressions
        if: inputs.update_baseline != true
        run: |
          if [ -f scripts/check_perf_regression.sh ]; then
            bash scripts/check_perf_regression.sh
          else
            echo "No regression checker found, skipping."
          fi

      - name: Upload scale benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: scale-bench-results-${{ github.sha }}
          path: |
            scale-bench-results.txt
            generator-bench-results.txt
          retention-days: 90

      - name: Save scale baseline locally
        if: inputs.update_baseline
        run: |
          mkdir -p .benchmarks
          cat scale-bench-results.txt generator-bench-results.txt > .benchmarks/scale-baseline.txt
