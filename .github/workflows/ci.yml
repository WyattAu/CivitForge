name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_VERSION: "1.88"
  CARGO_TERM_COLOR: always
  # Deny warnings in all compiler invocations for consistent quality gating.
  RUSTFLAGS: "-D warnings"
  # Limit parallel compilation jobs to avoid OOM on 7GB GitHub runners.
  # The workspace has 12 crates; unrestricted parallelism exhausts memory.
  CARGO_BUILD_JOBS: "3"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --check --all

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # Tests requiring PostgreSQL are #[ignore]-gated; they are skipped here.
      # CI without a DB validates that all other tests compile and pass.
      - run: cargo test --workspace --locked

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Security findings MUST gate merges. Triage unmaintained/yanked crates
    # explicitly in .cargo/audit.toml rather than silencing the whole job.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # cargo audit exits non-zero on vulnerabilities at/above severity_threshold
      # (set to "medium" in .cargo/audit.toml). Unmaintained crates produce
      # informational warnings that do NOT fail the build.
      - name: Run cargo audit
        run: cargo audit

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/civit-ui
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build WASM UI
        run: cd crates/civit-ui && trunk build --release
      - name: Upload WASM dist artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: civit-ui-dist
          path: crates/civit-ui/dist/
          retention-days: 30

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push'
    needs: [fmt, clippy, test, audit, wasm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo build --workspace --release --locked
