name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_VERSION: "1.96"
  CARGO_TERM_COLOR: always
  # Deny warnings in all compiler invocations for consistent quality gating.
  RUSTFLAGS: "-D warnings"
  # Limit parallel compilation jobs to avoid OOM on 7GB GitHub runners.
  # The workspace has 12 crates; unrestricted parallelism exhausts memory.
  CARGO_BUILD_JOBS: "2"
  # Reduce debug info to line-tables-only to cut memory usage during
  # compilation (full debuginfo doubles memory per rustc process).
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --check --all

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install protoc -y --no-progress
          echo "C:\ProgramData\chocolatey\lib\protoc\tools\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # Tests requiring PostgreSQL are #[ignore]-gated; they are skipped here.
      # CI without a DB validates that all other tests compile and pass.
      - run: cargo test --workspace --locked

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civit
          POSTGRES_PASSWORD: test
          POSTGRES_DB: civit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Run integration tests
        run: cargo test --locked -p civit-core --features integration -- --test-threads=1
        env:
          DATABASE_URL: postgres://civit:test@localhost:5432/civit_test

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Security findings MUST gate merges. Triage unmaintained/yanked crates
    # explicitly in .cargo/audit.toml rather than silencing the whole job.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # cargo audit exits non-zero on vulnerabilities at/above severity_threshold.
      # RUSTSEC-2023-0071 (rsa Marvin Attack) is a transitive dependency with no
      # fix available. Ignored explicitly until upstream releases a patched version.
      - name: Run cargo audit
        run: cargo audit --ignore RUSTSEC-2023-0071

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/civit-ui
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Install Tailwind CSS CLI
        run: cd crates/civit-ui && pnpm install --frozen-lockfile --ignore-scripts
      - name: Build Tailwind CSS
        run: cd crates/civit-ui && pnpm exec tailwindcss -i input.css -o assets/tailwind.css --minify
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build WASM UI
        run: cd crates/civit-ui && trunk build --release
      - name: Upload WASM dist artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: civit-ui-dist
          path: crates/civit-ui/dist/
          retention-days: 30

  bench:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Run benchmarks
        run: cargo bench --workspace --locked -- --output-format bencher | tee bench-results.txt
      - name: Check for regression
        run: |
          if [ ! -f .benchmarks/baseline.txt ]; then
            echo "No baseline found — skipping regression check."
            exit 0
          fi
          echo "Comparing against baseline..."
          failed=0
          while IFS='|' read -r name time unit; do
            # Skip header lines
            [[ "$name" == "name" ]] && continue
            # Find matching baseline entry
            baseline_time=$(grep "^${name}|" .benchmarks/baseline.txt | cut -d'|' -f2 || true)
            if [ -z "$baseline_time" ]; then
              echo "NEW: $name = $time $unit (no baseline)"
              continue
            fi
            # Compare using awk for floating point
            threshold=$(awk "BEGIN { printf \"%.2f\", $baseline_time * 1.10 }")
            regressed=$(awk "BEGIN { print ($time > $threshold) ? 1 : 0 }")
            if [ "$regressed" -eq 1 ]; then
              echo "REGRESSION: $name = $time $unit (baseline: $baseline_time, threshold: $threshold)"
              failed=1
            else
              echo "OK: $name = $time $unit (baseline: $baseline_time)"
            fi
          done < <(tail -n +2 bench-results.txt)
          if [ "$failed" -eq 1 ]; then
            echo "::error::Benchmark regression detected (>10% slower than baseline)"
            exit 1
          fi
          echo "No regressions detected."
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: bench-results.txt
          retention-days: 30

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push'
    needs: [fmt, clippy, test, integration, audit, wasm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo build --workspace --release --locked
