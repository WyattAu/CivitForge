name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build release binaries
        run: cargo build --workspace --release --locked

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp target/release/civit-core artifacts/
          cp target/release/civit-runner artifacts/
          cp target/release/civit-brain artifacts/
          cp target/release/civit-vfs artifacts/
          # Generate checksums
          cd artifacts && sha256sum * > checksums-sha256.txt

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        continue-on-error: true
        with:
          subject-path: artifacts/civit-core

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
