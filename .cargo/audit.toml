# CivitForge cargo-audit configuration
# Triaging unmaintained/yanked crates explicitly rather than silencing the whole job.

[advisories]
# Severity threshold: vulnerabilities at or above "medium" fail the build.
# Unmaintained crates are informational warnings that do NOT fail the build.
unmaintained = "warn"

# Ignore specific advisories (document rationale for each)
# ignore = [
#     # Example: RUSTSEC-20XX-NNNN -- informational only, no exploit path in our usage.
#     # "RUSTSEC-20XX-NNNN",
# ]
