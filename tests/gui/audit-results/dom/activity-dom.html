        // Dark mode: apply before first paint to prevent flash
        (function() {
            var theme = localStorage.getItem('civit-theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
        // Watch for system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            if (!localStorage.getItem('civit-theme')) {
                document.documentElement.classList.toggle('dark', e.matches);
            }
        });
        // Global theme toggle (called from sidebar via onclick attribute)
        // Using global function to avoid Leptos on:click WebKit auto-fire bug
        window.toggleTheme = function() {
            var isDark = document.documentElement.classList.contains('dark');
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('civit-theme', isDark ? 'light' : 'dark');
            // Update all toggle buttons
            document.querySelectorAll('[data-theme-toggle-icon]').forEach(function(el) {
                el.textContent = isDark ? '\u2600\uFE0F' : '\uD83C\uDF19';
            });
        };
        // Syntax highlighting: call after Leptos renders content
        window.highlightCode = function() {
            document.querySelectorAll('pre code[data-lang]').forEach(function(block) {
                if (block.dataset.lang && block.dataset.lang !== '') {
                    hljs.highlightElement(block);
                }
            });
        };
        // Markdown rendering helper
        window.renderMarkdown = function(content) {
            if (typeof mdit === 'undefined') {
                try { mdit = window.markdownit({ html: true, linkify: true, typographer: true }); } catch(e) { return content; }
            }
            return mdit.render(content);
        };
        // Attach click handlers to theme toggle elements after DOM ready
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('[data-theme-toggle]').forEach(function(el) {
                el.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.toggleTheme();
                });
            });
            document.querySelectorAll('[data-action-logout]').forEach(function(el) {
                el.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.location.href = '/__logout__';
                });
            });
            // Branch selector: navigate to code page with ?ref=branch
            document.addEventListener('change', function(e) {
                if (e.target && e.target.hasAttribute('data-branch-selector')) {
                    var branch = e.target.value;
                    var url = new URL(window.location.href);
                    if (branch) {
                        url.searchParams.set('ref', branch);
                    } else {
                        url.searchParams.delete('ref');
                    }
                    url.searchParams.delete('page'); // Reset to page 1 on branch switch
                    window.location.href = url.toString();
                }
            });
        });
