[workspace]
resolver = "2"
members = [
    "civit-core",
    "civit-runner",
    "civit-brain",
    "civit-vfs",
    "civit-crypto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/civitforge/civitforge"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "auth"] }
tonic = "0.12"
prost = "0.13"
gix = { version = "0.70", default-features = false, features = ["max-performance-safe", "revision", "parallel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }
redis = { version = "0.27", features = ["tokio-comp"] }
jsonwebtoken = "9"
kube = { version = "0.98", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.24", features = ["v1_30"] }
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
ring = "0.17"
rcgen = "0.13"
x509-parser = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
futures = "0.3"
dashmap = "6"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
base64 = "0.22"
hex = "0.4"
tempfile = "3"
libc = "0.2"
