[workspace]
resolver = "2"
members = [
    "crates/civit-shared",
    "crates/civit-pipeline",
    "crates/civit-core",
    "crates/civit-runner",
    "crates/civit-brain",
    "crates/civit-vfs",
    "crates/civit-crypto",
    "crates/civit-ui",
    # NOTE: civit-desktop requires system deps (webkit2gtk).
    # Build separately: cd crates/civit-desktop && cargo tauri build
    # "crates/civit-desktop",
]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/civitforge/civitforge"
rust-version = "1.88"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "auth", "set-header", "fs"] }
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
prost-build = "0.13"
gix = { version = "0.70", default-features = false, features = ["max-performance-safe", "revision", "parallel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
jsonwebtoken = "9"
kube = { version = "0.98", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.24", features = ["v1_30"] }
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
ring = "0.17"
rcgen = "0.13"
x509-parser = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
futures = "0.3"
dashmap = "6"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
base64 = "0.22"
hex = "0.4"
tempfile = "3"
libc = "0.2"
zstd = "0.13"
russh = "0.61"
rand = "0.10"
flate2 = "1"
schemars = { version = "0.8", features = ["chrono"] }
regex = "1"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport", "pool", "hostname"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
