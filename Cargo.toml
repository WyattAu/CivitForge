[workspace]
resolver = "2"
members = [
    "crates/civit-shared",
    "crates/civit-pipeline",
    "crates/civit-core",
    "crates/civit-workflow",
    "crates/civit-federation",
    "crates/civit-ci",
    "crates/civit-storage",
    "crates/civit-db",
    "crates/civit-git",
    "crates/civit-runner",
    "crates/civit-brain",
    "crates/civit-vfs",
    "crates/civit-crypto",
    "crates/civit-auth",
    "crates/civit-shard",
    "crates/civit-types",
    "crates/civit-ui",
    "crates/civit-telemetry",
    "crates/civit-security",
    # NOTE: civit-desktop requires system deps (webkit2gtk).
    # Build separately: cd crates/civit-desktop && cargo tauri build
    # "crates/civit-desktop",
]
exclude = ["crates/civit-desktop"]

[workspace.package]
version = "3.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/civitforge/civitforge"
rust-version = "1.96"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "auth", "set-header", "fs"] }
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
prost-build = "0.13"
gix = { version = "0.84", default-features = false, features = ["max-performance-safe", "revision", "parallel", "sha1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
jsonwebtoken = "9"
kube = { version = "4.2", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.24", features = ["v1_30"] }
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
ring = "0.17"
rcgen = "0.13"
x509-parser = { version = "0.17", features = ["verify"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
futures = "0.3"
dashmap = "6"
parking_lot = "0.12"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
base64 = "0.22"
hex = "0.4"
tempfile = "3"
libc = "0.2"
zstd = "0.13"
russh = "0.61"
rand = "0.10"
aes-gcm = "0.10"
flate2 = "1"
schemars = { version = "0.8", features = ["chrono"] }
regex = "1"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport", "pool", "hostname"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
open = "5"
criterion = { version = "0.5", features = ["html_reports"] }
salting = { version = "1" }
tokenkit = { version = "0.1" }
cryptkit = { version = "0.1" }

# ── WASM-friendly release profile ──────────────────────────────────────────────
# Apply to the entire workspace; trunk --release picks these up automatically.
[profile.release]
opt-level = "z"      # optimise for size
lto = true           # full LTO — smaller binary, slower compile
codegen-units = 1    # single codegen unit — better optimisation
strip = "symbols"    # strip debug symbols
panic = "abort"      # smaller binaries (no unwind tables)
overflow-checks = false
incremental = false
