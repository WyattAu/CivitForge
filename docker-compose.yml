# =============================================================================
# CivitForge - Full Stack (Production-Like Smoke Test)
# =============================================================================
# Usage:
#   docker compose up -d        # Start all services
#   docker compose logs -f      # Follow logs
#   docker compose down -v      # Stop and remove volumes
#   ./smoke-test.sh             # Run smoke test against running stack
#
# Default credentials (development only):
#   JWT_SECRET: change-me-change-me (>=16 chars)
#   PostgreSQL: civit/civit on port 5432
#   Redis:    no auth on port 6379
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - Primary database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: civit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: civit
      POSTGRES_USER: civit
      POSTGRES_PASSWORD: civit-dev-secure-pw-2026
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civit -d civit"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis - Session cache, edge cache, pub/sub
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: civit-redis
    restart: unless-stopped
    command: redis-server --requirepass civit-redis-dev-2026
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "civit-redis-dev-2026", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # CivitForge Core - API server + SSH gateway + WASM UI
  # ---------------------------------------------------------------------------
  civitforge:
    build:
      context: .
      dockerfile: container/civit-core/Dockerfile
    container_name: civit-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Required
      DATABASE_URL: postgres://civit:civit-dev-secure-pw-2026@postgres:5432/civit
      JWT_SECRET: change-me-change-me-dev-secret
      # Optional (defaults shown)
      CIVIT_HOST: "0.0.0.0"
      CIVIT_PORT: "8080"
      REDIS_URL: redis://:civit-redis-dev-2026@redis:6379
      JWT_EXPIRY_HOURS: "24"
      CIVIT_STORAGE_PATH: /var/lib/civit/repos
      FEDERATION_ENABLED: "false"
      FEDERATION_INSTANCE_ID: "local-dev"
      FEDERATION_INSTANCE_DOMAIN: "localhost"
      RUST_LOG: civit_core=info,tower_http=debug
    ports:
      - "9091:8080"   # API (host:9091 → container:8080)
      - "2222:2222"   # SSH (git)
    volumes:
      - civit-data:/var/lib/civit/repos
      - civit-logs:/var/log/civit
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # CivitForge Brain - Search indexing and code intelligence daemon
  # ---------------------------------------------------------------------------
  brain:
    build:
      context: .
      dockerfile: container/civit-brain/Dockerfile
    container_name: civit-brain
    restart: unless-stopped
    depends_on:
      civitforge:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://civit:civit-dev-secure-pw-2026@postgres:5432/civit
      REDIS_URL: redis://:civit-redis-dev-2026@redis:6379
      CIVIT_STORAGE_PATH: /var/lib/civit/repos
      RUST_LOG: civit_brain=info
    ports:
      - "8082:8082"   # Brain HTTP API
    volumes:
      - civit-data:/var/lib/civit/repos
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # CivitForge Runner - CI/CD pipeline daemon
  # ---------------------------------------------------------------------------
  runner:
    build:
      context: .
      dockerfile: container/runner/Dockerfile
    container_name: civit-runner
    restart: unless-stopped
    depends_on:
      civitforge:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://civit:civit-dev-secure-pw-2026@postgres:5432/civit
      CIVIT_RUNNER_API_URL: http://civitforge:8080
      CIVIT_RUNNER_NAME: local-docker-runner
      CIVIT_RUNNER_TAGS: docker,linux
      CIVIT_RUNNER_WORKDIR: /home/runner/work
      PODMAN_HOST: unix:///run/podman/podman.sock
      RUST_LOG: civit_runner=info
    ports:
      - "8088:8088"   # Runner HTTP
    volumes:
      - runner-work:/home/runner/work
      - /run/podman:/run/podman:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # CivitForge VFS - Virtual filesystem gateway
  # ---------------------------------------------------------------------------
  vfs:
    build:
      context: .
      dockerfile: container/civit-vfs/Dockerfile
    container_name: civit-vfs
    restart: unless-stopped
    depends_on:
      civitforge:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://civit:civit-dev-secure-pw-2026@postgres:5432/civit
      REDIS_URL: redis://:civit-redis-dev-2026@redis:6379
      CIVIT_STORAGE_PATH: /var/lib/civit/repos
      RUST_LOG: civit_vfs=info
    ports:
      - "9090:9090"   # gRPC/VFS
    volumes:
      - civit-data:/var/lib/civit/repos
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  civit-data:
    driver: local
  civit-logs:
    driver: local
  runner-work:
    driver: local
