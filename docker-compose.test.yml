version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: civit
      POSTGRES_PASSWORD: test
      POSTGRES_DB: civit_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
