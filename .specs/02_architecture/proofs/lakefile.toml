name = "civitforge-proofs"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["CivitforgeProofs"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "CivitforgeProofs"
