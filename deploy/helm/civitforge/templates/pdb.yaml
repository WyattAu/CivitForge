{{- if .Values.podDisruptionBudget.enabled }}
{{- range $component := list "api" "runner" "brain" "vfs" }}
{{- $pdb := index $.Values.podDisruptionBudget $component }}
{{- $values := index $.Values $component }}
{{- if and $values.enabled $pdb }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "civitforge.fullname" $ }}-{{ $component }}
  labels:
    {{- include "civitforge.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if $pdb.minAvailable }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- else if $pdb.maxUnavailable }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "civitforge.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
{{- end }}
{{- end }}
{{- end }}
