[package]
name = "civit-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
salting = { workspace = true }
tokenkit = { workspace = true }
zeroize = { version = "1", features = ["derive"] }
sha2 = { workspace = true, features = ["oid"] }
ldap3 = { version = "0.11", default-features = false, features = ["tls", "sync"] }
civit-db = { path = "../civit-db" }
civit-shared = { path = "../civit-shared" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
rand = "0.10"
chrono = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
webauthn-rs = { version = "0.5", optional = true, features = ["danger-credential-internals"] }
url = { version = "2", optional = true }
dashmap = { workspace = true, optional = true }
parking_lot = { workspace = true }

[features]
default = []
webauthn = ["dep:webauthn-rs", "dep:url", "dep:dashmap"]
