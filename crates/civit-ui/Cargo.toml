[package]
name = "civit-ui"
version.workspace = true
edition.workspace = true
description = "CivitForge Web UI — Leptos SSR + Tailwind CSS"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8" }
leptos_router = { version = "0.8" }
either_of = { version = "0.1" }
leptos_axum = { version = "0.8", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind", "serde"] }
uuid = { workspace = true, features = ["js"] }
getrandom = { version = "0.2", features = ["js"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
web-sys = { version = "0.3", optional = true, features = [
  "Window",
  "Document",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "Node",
  "Element",
  "Event",
  "EventTarget",
  "Location",
  "Storage",
  "Text",
  "HtmlDivElement",
  "HtmlParagraphElement",
  "HtmlSpanElement",
  "HtmlAnchorElement",
  "HtmlButtonElement",
  "HtmlFormElement",
  "HtmlHeadElement",
  "HtmlScriptElement",
  "Performance",
  "History",
  "DragEvent",
  "DataTransfer",
] }
js-sys = { version = "0.3", optional = true }
civit-shared = { path = "../civit-shared" }
reqwest = { workspace = true, features = ["json"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
urlencoding = "2"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["csr"]
csr = ["leptos/csr", "dep:console_error_panic_hook", "dep:web-sys", "dep:wasm-bindgen", "dep:js-sys", "dep:reqwest", "dep:getrandom", "dep:gloo-timers"]
ssr = ["leptos/ssr", "dep:leptos_axum", "dep:reqwest"]
debug-panel = []
