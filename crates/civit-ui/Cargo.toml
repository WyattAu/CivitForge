[package]
name = "civit-ui"
version.workspace = true
edition.workspace = true
description = "CivitForge Web UI — Leptos SSR + Tailwind CSS"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.7" }
leptos_router = { version = "0.7" }
either_of = { version = "0.1" }
leptos_axum = { version = "0.7", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["js"] }
getrandom = { version = "0.2", features = ["js"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
web-sys = { version = "0.3", optional = true, features = [
  "Window",
  "Document",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "Node",
  "Element",
  "Event",
  "Location",
  "Storage",
] }
civit-shared = { path = "../civit-shared" }
reqwest = { workspace = true, features = ["json"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = ["csr"]
csr = ["leptos/csr", "dep:console_error_panic_hook", "dep:web-sys", "dep:wasm-bindgen", "dep:reqwest", "dep:getrandom"]
ssr = ["leptos/ssr", "dep:leptos_axum", "dep:reqwest"]
