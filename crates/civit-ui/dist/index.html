    <!-- API URL override + automation support -->
    <script>
        if (!window.__CIVIT_API_URL) {
            window.__CIVIT_API_URL = "http://192.168.1.191:9091/api/v1";
        }
         // Ctrl+Shift+H: capture page HTML via POST to local endpoint + Tauri IPC
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && e.key === 'H') {
                e.preventDefault();
                var html = '<!-- Captured at ' + new Date().toISOString() + ' -->\n' + document.documentElement.outerHTML;
                if (window.__TAURI_INTERNALS__) {
                    window.__TAURI_INTERNALS__.invoke('save_page_html', { html: html });
                }
                fetch('/__capture__', { method: 'POST', body: html }).catch(function() {});
            }
        });
        // Auto-capture page HTML 3s after load (for automation)
        function capturePage() {
            var html = document.documentElement.outerHTML;
            if (window.__TAURI_INTERNALS__) {
                window.__TAURI_INTERNALS__.invoke('save_page_html', { html: html });
            }
            fetch('/__capture__', { method: 'POST', body: html }).catch(function() {});
            console.log('[capture] Auto-captured page HTML (' + html.length + ' bytes)');
        }
        setTimeout(capturePage, 3000);
        // Also capture on popstate (SPA navigation)
        window.addEventListener('popstate', function() {
            console.log('[navigate] popstate: ' + window.location.pathname);
            setTimeout(capturePage, 2000);
        });
        setInterval(function() {
            var navReq = new XMLHttpRequest();
            navReq.open('GET', '/__navigate__', true);
            navReq.onload = function() {
                var url = navReq.responseText;
                if (url && url.length > 1) {
                    console.log('[navigate] navigating to: ' + url);
                    // Full page navigation (SPA fallback in embedded server serves index.html)
                    window.location.href = url;
                }
            };
            navReq.onerror = function() {
                // If HTTP endpoint fails, try Tauri IPC
                if (window.__TAURI_INTERNALS__) {
                    window.__TAURI_INTERNALS__.invoke('read_navigate_trigger').then(function(url) {
                        if (url && url.length > 1) {
                            console.log('[navigate] ' + url);
                            window.location.href = url;
                        }
                    }).catch(function() {});
                }
            };
            navReq.send();
        }, 1000);
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && e.key === 'H') {
                e.preventDefault();
                var html = '<!-- Captured at ' + new Date().toISOString() + ' -->\n' + document.documentElement.outerHTML;
                if (window.__TAURI_INTERNALS__) {
                    window.__TAURI_INTERNALS__.invoke('save_page_html', { html: html });
                }
            }
        });
    </script>

</script>
