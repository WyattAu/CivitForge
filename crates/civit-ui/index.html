<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivitForge</title>
    <style>
:root {
  --font-display: 'Courier New', 'Consolas', 'Liberation Mono', monospace;
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --border-brutal: 2px solid;
  --color-accent: #3b82f6;
  --color-danger: #ef4444;
  --color-success: #22c55e;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-display);
  letter-spacing: -0.02em;
}

.blob-bg {
  position: relative;
}
.blob-bg::before {
  content: '';
  position: absolute;
  top: -20%;
  right: -10%;
  width: 40%;
  height: 120%;
  border-radius: 40% 60% 55% 45% / 55% 45% 60% 40%;
  opacity: 0.03;
  background: var(--color-accent);
  pointer-events: none;
  z-index: 0;
}
</style>
    <!-- API URL override + automation support -->
    <script>
        // __CIVIT_API_URL can be set via <script> tag before this point (e.g., Tauri injection)
        // If not set, the WASM API client falls back to window.location.origin + /api/v1
         // Ctrl+Shift+H: capture page HTML via POST to local endpoint + Tauri IPC
         // Ctrl+Shift+S: take screenshot via Tauri IPC
         document.addEventListener('keydown', function(e) {
             if (e.ctrlKey && e.shiftKey && (e.key === 'H' || e.key === 'S')) {
                 e.preventDefault();
                 if (e.key === 'H') {
                     var html = '<!-- Captured at ' + new Date().toISOString() + ' -->\n' + document.documentElement.outerHTML;
                     if (window.__TAURI_INTERNALS__) {
                         window.__TAURI_INTERNALS__.invoke('save_page_html', { html: html });
                     }
                     fetch('/__capture__', { method: 'POST', body: html }).catch(function() {});
                 } else if (e.key === 'S') {
                     if (window.__TAURI_INTERNALS__) {
                         window.__TAURI_INTERNALS__.invoke('take_screenshot');
                     }
                 }
             }
         });
        // Auto-capture page HTML 3s after load (for automation)
        function capturePage() {
            var html = document.documentElement.outerHTML;
            if (window.__TAURI_INTERNALS__) {
                window.__TAURI_INTERNALS__.invoke('save_page_html', { html: html });
            }
            fetch('/__capture__', { method: 'POST', body: html }).catch(function() {});
            console.log('[capture] Auto-captured page HTML (' + html.length + ' bytes)');
        }
        setTimeout(capturePage, 3000);
        // Also capture on popstate (SPA navigation)
        window.addEventListener('popstate', function() {
            console.log('[navigate] popstate: ' + window.location.pathname);
            setTimeout(capturePage, 2000);
        });
        setInterval(function() {
            var navReq = new XMLHttpRequest();
            navReq.open('GET', '/__navigate__', true);
            navReq.onload = function() {
                var url = navReq.responseText;
                if (url && url.length > 1) {
                    console.log('[navigate] navigating to: ' + url);
                    // Full page navigation (SPA fallback in embedded server serves index.html)
                    window.location.href = url;
                }
            };
            navReq.onerror = function() {
                // If HTTP endpoint fails, try Tauri IPC
                if (window.__TAURI_INTERNALS__) {
                    window.__TAURI_INTERNALS__.invoke('read_navigate_trigger').then(function(url) {
                        if (url && url.length > 1) {
                            console.log('[navigate] ' + url);
                            window.location.href = url;
                        }
                    }).catch(function() {});
                }
            };
            navReq.send();
        }, 1000);
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && e.key === 'H') {
                e.preventDefault();
                var html = '<!-- Captured at ' + new Date().toISOString() + ' -->\n' + document.documentElement.outerHTML;
                if (window.__TAURI_INTERNALS__) {
                    window.__TAURI_INTERNALS__.invoke('save_page_html', { html: html });
                }
            }
        });
    </script>
    <!-- Tailwind CSS v4 (build-time compiled, air-gap compatible) -->
    <link data-trunk rel="copy-file" href="assets/tailwind.css">
    <link rel="stylesheet" href="tailwind.css">
    <!-- Syntax highlighting: highlight.js 11.9 (50+ languages) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" media="(prefers-color-scheme: no-preference), (prefers-color-scheme: light)">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <!-- Markdown rendering: markdown-it + github flavor -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
    <!-- GitHub Markdown CSS (for rendered README) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-dark.min.css" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.min.css" media="(prefers-color-scheme: no-preference), (prefers-color-scheme: light)">
    <style>
        .markdown-body { background: transparent !important; }
        /* Override highlight.js style when dark mode is toggled via JS */
        html.dark .hljs { background: #0d1117 !important; }
    </style>
    <script>
        // Dark mode: apply before first paint to prevent flash
        (function() {
            var theme = localStorage.getItem('civit-theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
        // Watch for system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            if (!localStorage.getItem('civit-theme')) {
                document.documentElement.classList.toggle('dark', e.matches);
            }
        });
        // Global theme toggle (called from sidebar via onclick attribute)
        // Using global function to avoid Leptos on:click WebKit auto-fire bug
        window.toggleTheme = function() {
            var isDark = document.documentElement.classList.contains('dark');
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('civit-theme', isDark ? 'light' : 'dark');
            // Update all toggle buttons with text labels (no emoji per design standard)
            document.querySelectorAll('[data-theme-toggle-icon]').forEach(function(el) {
                el.textContent = isDark ? 'Light' : 'Dark';
            });
        };
        // Syntax highlighting: call after Leptos renders content
        window.highlightCode = function() {
            document.querySelectorAll('pre code[data-lang]').forEach(function(block) {
                if (block.dataset.lang && block.dataset.lang !== '') {
                    hljs.highlightElement(block);
                }
            });
        };
        // Markdown rendering helper
        window.renderMarkdown = function(content) {
            if (typeof mdit === 'undefined') {
                try { mdit = window.markdownit({ html: true, linkify: true, typographer: true }); } catch(e) { return content; }
            }
            return mdit.render(content);
        };
        // Attach click handlers to theme toggle elements after DOM ready
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('[data-theme-toggle]').forEach(function(el) {
                el.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.toggleTheme();
                });
            });
            document.querySelectorAll('[data-action-logout]').forEach(function(el) {
                el.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.location.href = '/__logout__';
                });
            });
            // Branch selector: navigate to code page with ?ref=branch
            document.addEventListener('change', function(e) {
                if (e.target && e.target.hasAttribute('data-branch-selector')) {
                    var branch = e.target.value;
                    var url = new URL(window.location.href);
                    if (branch) {
                        url.searchParams.set('ref', branch);
                    } else {
                        url.searchParams.delete('ref');
                    }
                    url.searchParams.delete('page'); // Reset to page 1 on branch switch
                    window.location.href = url.toString();
                }
            });
        });
    </script>

    <link data-trunk rel="copy-file" href="assets/sw.js" />
    <style>
        [data-trunk] { display: none; }
