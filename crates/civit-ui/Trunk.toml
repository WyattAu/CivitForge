[build]
target = "index.html"
release = true
public-url = "/"

[watch]
watch = ["src/", "assets/", "input.css"]

[serve]
address = "127.0.0.1"
port = 9092

[clean]
dist = "dist"

# Pre-build hook: compile Tailwind CSS from input.css.
# Requires @tailwindcss/cli (pnpm install in crates/civit-ui).
[[hooks]]
stage = "pre_build"
command = "sh"
args = ["-c", "test -f node_modules/.bin/tailwindcss && node_modules/.bin/tailwindcss -i input.css -o assets/tailwind.css --minify || echo 'tailwindcss not installed, using pre-built assets/tailwind.css'"]
