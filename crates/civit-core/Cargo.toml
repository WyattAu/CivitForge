[package]
name = "civit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
parking_lot = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
jsonwebtoken = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
dashmap = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
gix = { workspace = true }
tempfile = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true, features = ["oid"] }
hmac = { workspace = true }
sha1 = { workspace = true }
ring = { workspace = true }
pkcs8 = { version = "0.10", features = ["alloc"] }
zstd = { workspace = true }
russh = { workspace = true, optional = true }
rand = "0.10"
aes-gcm = { workspace = true }
flate2 = { workspace = true }
regex = { workspace = true }
schemars = { workspace = true }
smallvec = "1"
lettre = { workspace = true }
tar = "0.4"
tantivy = "0.22"
urlencoding = "2"
bcrypt = "0.17"
ldap3 = { version = "0.11", default-features = false, features = ["tls", "sync"] }
civit-shared = { path = "../civit-shared" }
civit-pipeline = { path = "../civit-pipeline" }
civit-federation = { path = "../civit-federation" }
civit-ci = { path = "../civit-ci" }
civit-storage = { path = "../civit-storage" }
civit-db = { path = "../civit-db" }
civit-git = { path = "../civit-git" }
civit-auth = { path = "../civit-auth" }
civit-types = { path = "../civit-types" }
civit-telemetry = { path = "../civit-telemetry" }
civit-security = { path = "../civit-security" }
civit-workflow = { path = "../civit-workflow" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
criterion = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
gix = { workspace = true }

[[bench]]
name = "core_benchmarks"
harness = false

[[bench]]
name = "scale_benchmarks"
harness = false
required-features = []

[[bench]]
name = "generators"
harness = false

[features]
default = ["webauthn"]
webauthn = ["civit-auth/webauthn"]
ssh-server = ["dep:russh"]
integration = []
pprof = []

[[bin]]
name = "civit-bench"
path = "src/bin/civit_bench.rs"

[[bin]]
name = "civit-scale"
path = "src/bin/civit_scale.rs"
