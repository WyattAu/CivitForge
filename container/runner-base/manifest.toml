[metadata]
name = "civitforge-runner-base"
version = "0.8.0-alpha"
description = "CivitForge CI runner base image with git, Podman CLI, and build tools"
vendor = "CivitForge"
source = "https://github.com/WyattAu/CivitForge"
license = "AGPL-3.0-or-later"
tier = "standard"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "binary"
url = "https://github.com/WyattAu/CivitForge"

[runtime]
entrypoint = ["civit-runner"]
cmd = []

[ports]
expose = [8088, 9101]

[labels]
"org.opencontainers.image.title" = "civitforge-runner-base"
"org.opencontainers.image.vendor" = "CivitForge"
"org.opencontainers.image.version" = "0.8.0-alpha"
"org.opencontainers.image.source" = "https://github.com/WyattAu/CivitForge"
"org.opencontainers.image.description" = "CivitForge CI runner base image with git, Podman CLI, and build tools"
"org.opencontainers.image.licenses" = "AGPL-3.0-or-later"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.wolfi" = "true"
"evergreen.image.tier" = "standard"
"evergreen.health.type" = "http"
"evergreen.image.category" = "ci"
"evergreen.image.status" = "functional"
